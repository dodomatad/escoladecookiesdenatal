      <path d="M19.8 4.6l-3.2 3.2a1.2 1.2 0 0 1-1.7 0l-3.2-3.2a1.2 1.2 0 0 1 0-1.7l3.2-3.2a1.2 1.2 0 0 1 1.7 0l3.2 3.2a1.2 1.2 0 0 1 0 1.7z" fill="#6B7280"/>
      <path d="M9.8 14.6l-3.2 3.2a1.2 1.2 0 0 1-1.7 0L1.7 14.6a1.2 1.2 0 0 1 0-1.7l3.2-3.2a1.2 1.2 0 0 1 1.7 0l3.2 3.2a1.2 1.2 0 0 1 0 1.7z" fill="#6B7280"/>
