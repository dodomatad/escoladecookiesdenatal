    <path d="M11 2L3 5.5v5.5c0 5 3.5 9.7 8 11 4.5-1.3 8-6 8-11V5.5L11 2z" fill="#6B7280"/>
    <!-- Checkmark inside Shield -->
    <path d="M7.8 11l2.4 2.4 4.3-4.3" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text -->
    <text x="25" y="15.5" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#4B5563" letter-spacing="-0.2">Compra Segura</text>
  </g>

