  </g>

  <!-- 3. VISA -->
  <g id="visa" transform="translate(216, 9)">
    <path d="M16.5 1l-3.3 14.5h-3l2.1-10.3c.1-.5.1-.7 0-.9-.2-.3-.6-.4-1.1-.4h-3.8c-.4 0-.7.2-.9.5L1 15.5h3.3l.6-1.8h4l.4 1.8h2.9l4.5-14.5h-3zm-8.2 10.1l1.8-5 .7 5H8.3z" fill="#4B5563"/>
    <path d="M25 1l-2.4 14.5h-3L22 1h3zm9.4 4.6c-.3-.7-.8-1.2-1.8-1.6-.6-.2-1.5-.4-2.4-.4-2.5 0-4 1.1-4 2.8 0 1.3 1.2 2 2.2 2.5 1 .4 1.3.7 1.3 1.1 0 .6-.8.9-1.5.9-1.2 0-1.9-.2-3-.6l-.4-.2-.4 2.6c.8.4 2.2.6 3.7.6 2.9 0 4.7-1.3 4.7-3.1 0-1.5-1-2.3-2.5-2.9-.9-.4-1.4-.7-1.4-1.1 0-.4.4-.8 1.4-.8 1 0 1.8.2 2.3.4l.3.1.5-2.4z" fill="#4B5563"/>
